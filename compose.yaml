# =============================================================================
# Achat - full stack (MySQL + Spring Boot API + Angular UI + observability)
#
#   docker compose up -d --build          # http://localhost:4200
#   OTEL_METRICS_ENABLED=false OTEL_TRACING_ENABLED=false \
#     docker compose up -d mysql backend frontend  # skip observability
#
# The root .env is the single source for local backend, frontend and Compose
# values (see .env.example). Container-only addresses are overridden below.
# =============================================================================

name: achat

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-achatdb}
      # The MySQL image refuses "root" here: root is configured by
      # MYSQL_ROOT_PASSWORD, DB_USERNAME/DB_PASSWORD create a regular app user.
      MYSQL_USER: ${DB_USERNAME:-achat_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    image: achat-backend:local
    restart: unless-stopped
    environment:
      SERVER_PORT: "8089"
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-achatdb}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-achat_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
      OTEL_METRICS_ENABLED: ${OTEL_METRICS_ENABLED:-true}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
      # Root .env points Maven at localhost; containers must use the LGTM
      # service name instead.
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://grafana-lgtm:4318/v1/metrics
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://grafana-lgtm:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8089}:8089"

  frontend:
    build:
      context: ./frontend
    image: achat-frontend:local
    restart: unless-stopped
    environment:
      # nginx proxies /api/* to this origin (same-origin for the browser).
      # The root .env value (localhost:8089) is for ng serve; inside Compose
      # the frontend must reach the backend by service name.
      BACKEND_URL: http://backend:8089
      DNS_RESOLVER: ${DNS_RESOLVER:-127.0.0.11}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Host 4200 to avoid Jenkins (usually :8080); container listens on 8080.
      - "${FRONTEND_PORT:-4200}:8080"

  # Local LGTM stack: Grafana, Loki, Tempo, Prometheus and the OTel collector.
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "4317:4317"
      - "4318:4318"

  # Reads Docker container logs and pushes them to Loki. In Kubernetes, Alloy
  # reads pod logs through the API instead. The socket mount is local-only.
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      grafana-lgtm:
        condition: service_healthy

volumes:
  mysql-data:
  alloy-data:
