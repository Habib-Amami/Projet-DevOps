apiVersion: apps/v1
kind: Deployment
metadata:
  name: achat-backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: achat-backend }
  template:
    metadata:
      labels: { app: achat-backend }
    spec:
      containers:
        - name: backend
          image: DOCKER_USER_PLACEHOLDER/achat-backend:BUILD_PLACEHOLDER
          ports:
            - containerPort: 8089
          env:
            - name: DB_URL
              value: "jdbc:mysql://mysql:3306/achatdb?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: MYSQL_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8089
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: achat-backend
spec:
  type: LoadBalancer
  selector: { app: achat-backend }
  ports:
    - port: 80
      targetPort: 8089