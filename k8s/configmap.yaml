# Same variable names as compose.yaml / .env.example. Passwords live in the
# achat-db Secret (see examples/secret.yaml), never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: achat-config
  namespace: achat
data:
  MYSQL_DATABASE: achatdb
  SERVER_PORT: "8089"
  DB_URL: jdbc:mysql://mysql:3306/achatdb?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
  JPA_DDL_AUTO: validate
  # MySQL uses emptyDir in the lab, so the demo data is re-seeded on restart.
  APP_SEED_ENABLED: "true"
  # Swagger for the cluster demo: kubectl -n achat port-forward svc/backend 8090:8089.
  SPRINGDOC_ENABLED: "true"
  # Metrics and traces go to the in-cluster LGTM collector; Alloy collects logs.
  OTEL_METRICS_ENABLED: "true"
  OTEL_TRACING_ENABLED: "true"
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://grafana-lgtm:4318/v1/metrics
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://grafana-lgtm:4318/v1/traces
