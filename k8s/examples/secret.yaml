# Example only - do not commit real values. It lives in k8s/examples/ so that
# "kubectl apply -f k8s/" never overwrites the real Secret.
# Jenkins (DEPLOY TO EKS) creates this Secret from its credentials.
# For a manual deploy:
#   kubectl -n achat create secret generic achat-db \
#     --from-literal=MYSQL_ROOT_PASSWORD=... \
#     --from-literal=DB_USERNAME=achat_user \
#     --from-literal=DB_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: achat-db
  namespace: achat
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: replace-with-a-random-root-password
  # Must NOT be "root": the MySQL image creates this as a regular user.
  DB_USERNAME: achat_user
  DB_PASSWORD: replace-with-a-random-app-password
