name: achat-ci

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: achat-ci-jenkins:local
    container_name: achat-ci-jenkins
    # Local-only setting: this makes the Docker socket usable on both Linux
    # and Docker Desktop. Never expose this Jenkins instance publicly.
    user: root
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
      - "127.0.0.1:${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci
    # SonarQube and Nexus are required parts of this CI stack.
    depends_on:
      - sonarqube
      - nexus
    restart: unless-stopped

  sonarqube-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    networks:
      - ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - ci
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:3.97.3
    ports:
      - "127.0.0.1:${NEXUS_PORT:-8081}:8081"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - ci
    restart: unless-stopped

volumes:
  jenkins_home:
  sonarqube_db:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:

networks:
  ci:
    driver: bridge
