# Application
spring.application.name=achat
# Maven runs from backend/, so load the repository-root .env. Containers receive
# the same values as normal environment variables instead of this file.
spring.config.import=optional:file:../.env[.properties]
server.port=${SERVER_PORT:8089}

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/achatdb?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:achat_user}
spring.datasource.password=${DB_PASSWORD:change-me}

# Connection pool
spring.datasource.hikari.pool-name=AchatHikariPool
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
# V1 is the baseline for databases created by an older Hibernate-managed setup.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Actuator / Health
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=achat

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO

# Docker Compose
spring.docker.compose.enabled=false

# Data seeding (local development only; enabled by Compose, disabled by default)
app.seed.enabled=${APP_SEED_ENABLED:false}

# API documentation (enabled locally, disabled by default for the cluster)
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# OpenTelemetry: metrics and traces are pushed over OTLP.
# They are disabled by default so the app stays quiet without a collector.
management.tracing.enabled=${OTEL_TRACING_ENABLED:false}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.tracing.export.otlp.enabled=${OTEL_TRACING_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

management.otlp.metrics.export.enabled=${OTEL_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

# Logs are collected from container stdout by Alloy, not exported by the app.
management.logging.export.otlp.enabled=false

