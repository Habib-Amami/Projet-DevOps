# Application
spring.application.name=achat
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8089}

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/achatdb?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:achat_user}
spring.datasource.password=${DB_PASSWORD:change-me}

# Connection pool
spring.datasource.hikari.pool-name=AchatHikariPool
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
# V1 is the baseline for databases created by an older Hibernate-managed setup.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Actuator / Health
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO

# Docker Compose
spring.docker.compose.enabled=false

# OpenTelemetry
management.otlp.metrics.export.enabled=false
