# ============================================================
# Profil de test : surcharge application.properties
# pour les tests d'intégration avec Testcontainers (MySQL)
# ============================================================

# La datasource est fournie dynamiquement par Testcontainers via @ServiceConnection
# Flyway tourne sur la base Testcontainers – reset complet à chaque run
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-on-validation-error=false

# Hibernate valide le schéma créé par Flyway (pas de génération auto)
spring.jpa.hibernate.ddl-auto=validate

# Désactive Docker Compose (Testcontainers gère le MySQL)
spring.docker.compose.enabled=false

# Désactive l'import du .env racine (indisponible dans CI/test)
spring.config.import=

# Désactive OpenTelemetry et tracing pour accélérer le démarrage
management.tracing.enabled=false
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# Réduit le pool de connexions en test
spring.datasource.hikari.maximum-pool-size=2
